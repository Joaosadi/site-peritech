<style>
  :root {
    --bg: #0F1A24; --text: #E4EAED; --muted: #9AA8B2; --rule: #263544;
    --accent: #5FB3A3; --accent-hover: #7CC5B7; --on-accent: #0F1A24; --deep: #0A121A;

    --gutter: clamp(20px, 5vw, 48px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: var(--serif); font-size: 1.125rem; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter); width: 100%; }
  header { border-bottom: 1px solid var(--rule); }
  header .wrap { height: 68px; display: flex; align-items: center; }
  .logo {
    font-family: var(--sans); font-weight: 800; font-size: 1.35rem; font-stretch: 75%;
    text-decoration: none; letter-spacing: 0.01em; display: flex; align-items: center; gap: 12px;
  }
  main { flex: 1; display: flex; align-items: center; padding: 64px 0; }
  .codigo { font-family: var(--sans); color: var(--accent); font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 14px; }
  h1 {
    font-family: var(--sans); font-weight: 750; font-stretch: 68%;
    font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1; letter-spacing: -0.015em; margin: 0 0 20px;
  }
  p { margin: 0 0 1em; max-width: 56ch; color: var(--muted); }
  .acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; font-family: var(--sans); font-weight: 600; font-size: 0.98rem;
    padding: 12px 20px; border-radius: 4px; text-decoration: none; border: 1.5px solid var(--muted);
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:not(.btn-primary):hover { background: var(--text); border-color: var(--text); color: var(--bg); }
  footer { background: var(--deep); color: #8C98A1; border-top: 1px solid #2E3B47; font-family: var(--sans); font-size: 0.9rem; }
  footer .wrap { padding-top: 28px; padding-bottom: 28px; }
  @media (max-width: 600px) { .acoes .btn { width: 100%; justify-content: center; padding: 15px 20px; } }
</style>
